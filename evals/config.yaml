# Eval thresholds (spec 13.2). The runner exits 1 if any metric is below its threshold.
thresholds:
  precision: 0.85
  recall: 0.75
  final_decision_accuracy: 0.90
  owner_due_accuracy: 0.85
  evidence_faithfulness: 1.00
  trap_accuracy: 1.00
  # Share of decisions/tasks shown as official (no "needs confirmation" flag) that are real ones.
  official_precision: 0.90

# QA eval thresholds (run_qa). Kept apart from `thresholds` so run_pipeline is unaffected.
qa_thresholds:
  qa_citation_accuracy: 0.85
  qa_latest_state_accuracy: 1.00
  qa_refusal_accuracy: 1.00
