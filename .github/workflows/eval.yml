name: Eval

on:
  pull_request:
    paths:
      - backend/app/ai/prompts/**
      - backend/app/ai/agents/**
      - evals/**
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: meeting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d meeting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/meeting_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check ANTHROPIC_API_KEY
        id: gate
        working-directory: .
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Eval bỏ qua: chưa cấu hình secret ANTHROPIC_API_KEY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Create test database
        if: steps.gate.outputs.run == 'true'
        working-directory: .
        run: psql "postgresql://app:app@localhost:5432/meeting" -c "CREATE DATABASE meeting_test;"
      - name: Install dependencies (with embeddings)
        if: steps.gate.outputs.run == 'true'
        run: uv sync --locked --extra embeddings
      - name: Cache Hugging Face models
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-m3
      - name: Pipeline eval
        if: steps.gate.outputs.run == 'true'
        run: PYTHONPATH=.. uv run python -m evals.runners.run_pipeline
      - name: QA eval
        # Runs even when the pipeline eval failed; the job still fails if either step failed.
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: PYTHONPATH=.. uv run python -m evals.runners.run_qa
      - name: Upload eval reports
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/
          if-no-files-found: ignore
