name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: meeting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d meeting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Create test database
        working-directory: .
        run: psql "postgresql://app:app@localhost:5432/meeting" -c "CREATE DATABASE meeting_test;"
      - run: uv sync --locked
      - run: uv run ruff check app ../tests ../evals
      - run: uv run mypy
      - name: Tests
        env:
          REQUIRE_DB: "1"
          TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/meeting_test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_dummy
        run: npm run build
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Regenerate API types
        run: npm run gen:types
      - name: Check API types are up to date
        working-directory: .
        run: git diff --exit-code frontend/openapi.json frontend/src/types/api.ts

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: meeting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d meeting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/meeting
      REDIS_URL: redis://localhost:6379/0
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
      E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_USERNAME }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
    steps:
      - name: Check Clerk secrets
        id: gate
        run: |
          if [ -z "$CLERK_SECRET_KEY" ] || [ -z "$E2E_CLERK_USER_USERNAME" ]; then
            echo "::notice::E2E bỏ qua: chưa cấu hình secret Clerk"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: backend
        run: uv sync --locked
      - name: Migrate database
        if: steps.gate.outputs.run == 'true'
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Install frontend dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
