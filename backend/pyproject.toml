[project]
name = "meetmind-backend"
version = "0.1.0"
description = "MeetMind AI backend: meeting-intelligence core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "anthropic",
    "langgraph",
    "rapidfuzz",
    "python-docx",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
pythonpath = [".", ".."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["app", "../evals"]
