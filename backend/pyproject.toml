[project]
name = "meetmind-backend"
version = "0.1.0"
description = "MeetMind AI backend: meeting-intelligence core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "anthropic",
    "langgraph",
    "rapidfuzz",
    "python-docx",
    "pyyaml",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "arq>=0.28.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "pgvector>=0.5.1",
    "openai>=3.29.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers", "torch"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs Postgres"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["app", "../evals"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true
